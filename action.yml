name: Mimiq preview check
description: AI agents use each preview deploy like your users and comment on the PR with what broke and where they got stuck.
author: Mimiq
branding:
  icon: users
  color: green
inputs:
  api-key:
    description: Your Mimiq API key (mimiqai.com, Settings, "Create a key"). Store it as a secret. Without a key, a small free check runs (up to 3 agents, daily limits apply).
    required: false
    default: ''
  url:
    description: The URL to test. Defaults to the preview URL of the deployment that triggered the workflow (deployment_status events from Vercel, Netlify, Cloudflare Pages and others).
    required: false
    default: ''
  goal:
    description: The task each agent tries, in plain words.
    required: false
    default: Sign up and start using it
  audience:
    description: Who the agents act as, e.g. "freelance designers" or "parents shopping for school shoes". If empty, Mimiq picks the likely audience from the page.
    required: false
    default: ''
  people:
    description: How many agents (1 to 10). Each uses 5 credits.
    required: false
    default: '3'
  max-steps:
    description: Optional step limit per agent (10 to 200). Leave empty and agents keep going until they finish the task or get stuck.
    required: false
    default: ''
  timeout-seconds:
    description: How long to wait for the result (60 to 3600).
    required: false
    default: '2400'
  comment:
    description: Post (and keep updating) one comment on the pull request.
    required: false
    default: 'true'
  fail-on:
    description: When to fail the check. "never" (default), "gave-up" (anyone gave up), or "stuck" (anyone did not finish).
    required: false
    default: never
  vercel-bypass-secret:
    description: For previews behind Vercel Deployment Protection, your "Protection Bypass for Automation" secret. Sent to Mimiq for this run only, never put in the URL or shown in results.
    required: false
    default: ''
  basic-auth-username:
    description: For a preview behind a browser password prompt (basic auth), the username.
    required: false
    default: ''
  basic-auth-password:
    description: The basic-auth password. Store it as a secret.
    required: false
    default: ''
  login-email:
    description: To test pages behind a sign-in, the email or username of a test account the agents sign in with. Use a test account, not a real one.
    required: false
    default: ''
  login-password:
    description: The test account's password. Store it as a secret. The agents type a placeholder; the real value is filled in only in the browser and never shown in results or reports.
    required: false
    default: ''
  login-note:
    description: Optional hint for signing in, e.g. "The sign-in link is in the top right."
    required: false
    default: ''
  github-token:
    description: Token used to find the pull request and post the comment.
    required: false
    default: ${{ github.token }}
outputs:
  report-url:
    description: Link to the full report (with an API key).
    value: ${{ steps.check.outputs.report-url }}
  finished:
    description: How many agents finished the task.
    value: ${{ steps.check.outputs.finished }}
  partway:
    description: How many got partway.
    value: ${{ steps.check.outputs.partway }}
  gave-up:
    description: How many gave up.
    value: ${{ steps.check.outputs.gave-up }}
runs:
  using: composite
  steps:
    - id: check
      shell: bash
      run: node "$GITHUB_ACTION_PATH/index.mjs"
      env:
        MIMIQ_API_KEY: ${{ inputs.api-key }}
        MIMIQ_URL: ${{ inputs.url }}
        MIMIQ_GOAL: ${{ inputs.goal }}
        MIMIQ_AUDIENCE: ${{ inputs.audience }}
        MIMIQ_PEOPLE: ${{ inputs.people }}
        MIMIQ_MAX_STEPS: ${{ inputs.max-steps }}
        MIMIQ_TIMEOUT: ${{ inputs.timeout-seconds }}
        MIMIQ_COMMENT: ${{ inputs.comment }}
        MIMIQ_FAIL_ON: ${{ inputs.fail-on }}
        MIMIQ_VERCEL_BYPASS: ${{ inputs.vercel-bypass-secret }}
        MIMIQ_BASIC_USER: ${{ inputs.basic-auth-username }}
        MIMIQ_BASIC_PASSWORD: ${{ inputs.basic-auth-password }}
        MIMIQ_LOGIN_EMAIL: ${{ inputs.login-email }}
        MIMIQ_LOGIN_PASSWORD: ${{ inputs.login-password }}
        MIMIQ_LOGIN_NOTE: ${{ inputs.login-note }}
        GITHUB_TOKEN_INPUT: ${{ inputs.github-token }}
